name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest apps/api/tests -q

  api-postgres:
    # The same suite on the other backend. Worth a job of its own because the
    # Postgres path was broken from the day it was written and nobody noticed:
    # the DDL splitter cut the schema on a semicolon inside a comment, so the
    # schema could not be created, so nothing on that backend had ever run —
    # including the row locks and savepoint recovery written specifically for it.
    name: API — pytest on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: stride
          POSTGRES_DB: stride
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest apps/api/tests -q
        env:
          STRIDE_TEST_DATABASE_URL: postgresql://postgres:stride@localhost:5432/stride

  guards:
    # The three drift guards. Each was written after something slipped past a
    # review, and each has since caught something a review missed.
    name: Model & workbook guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python scripts/doc_consistency.py
      - run: uv run python scripts/admission_stress.py
      - run: uv run python business-plan/build_workbook.py
      - run: uv run python scripts/verify_workbook.py

  web:
    name: Web — typecheck + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
