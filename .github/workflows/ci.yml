name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest apps/api/tests -q

  api-postgres:
    # The same suite on the other backend. Worth a job of its own because the
    # Postgres path was broken from the day it was written and nobody noticed:
    # the DDL splitter cut the schema on a semicolon inside a comment, so the
    # schema could not be created, so nothing on that backend had ever run —
    # including the row locks and savepoint recovery written specifically for it.
    name: API — pytest on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: stride
          POSTGRES_DB: stride
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest apps/api/tests -q
        env:
          STRIDE_TEST_DATABASE_URL: postgresql://postgres:stride@localhost:5432/stride

  guards:
    # The three drift guards. Each was written after something slipped past a
    # review, and each has since caught something a review missed.
    name: Model & workbook guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python scripts/doc_consistency.py
      - run: uv run python scripts/admission_stress.py
      - run: uv run python business-plan/build_workbook.py
      - run: uv run python scripts/verify_workbook.py

  live:
    # The three scripts that drive a running server rather than the app object.
    # Everything above imports the code; this boots it, and that difference is
    # where "all tests pass but the demo is broken" lives -- a stale route, an
    # endpoint with no caller, a permission that disagrees with the one next to
    # it. None of it is visible to pytest.
    name: Live server - journey, permissions, propagation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m stride_api.cli init
        working-directory: apps/api
      - name: Start the API
        run: |
          uv run uvicorn stride_api.main:app --port 8490 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:8490/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "the API never came up"; exit 1
        working-directory: apps/api
      # Each script signs in as every demo account and the sweep alone makes
      # 348 requests, so both of them run into the rate limiter by design. They
      # wait for the refill and ask again rather than reading their own 429 as
      # a product failure, which is why there are no sleeps between these.
      - run: uv run python scripts/journey.py http://localhost:8490
      - run: uv run python scripts/permissions.py http://localhost:8490
      - run: uv run python scripts/propagation.py http://localhost:8490
      # The server is started with `&` and outlives the steps that use it. The
      # post-job cache prune then blocks on files that process still holds open,
      # waits five minutes and fails — so a job whose every check passed was
      # reported red, twice, for cleanup it had leaked itself.
      - name: Stop the API
        if: always()
        run: pkill -f "uvicorn stride_api" || true

  web:
    name: Web — typecheck + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
