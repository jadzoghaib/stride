# Stride — Render blueprint for the public demo.
#
#   https://render.com/docs/blueprint-spec
#
# What this deploys: the two existing container images and a managed Postgres.
# What it deliberately does NOT deploy: an open front door. `STRIDE_ALLOW_SIGNUP`
# is `0` here, because nothing in this system sends email -- `email_outbox`
# records what a person is owed and nothing drains it -- so a stranger who
# registered would be stranded at an address they could never verify, having
# accepted terms that still render a "pending legal review" banner. With signup
# closed the deployment collects no personal data at all, and the five seeded
# demo accounts run the whole product.
#
# Read docs/deploy.md before the first apply. Two values are not in this file
# on purpose: STRIDE_SECRET (generated, never committed) and the API's internal
# address, which Render assigns and which is set once from the dashboard.

databases:
  - name: stride-db
    databaseName: stride
    user: stride
    # The demo fits comfortably; raise the plan before real traffic, not before.
    plan: basic-256mb

services:
  # ── API ────────────────────────────────────────────────────────────────
  - type: web
    name: stride-api
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.api
    dockerContext: .
    plan: starter          # free instances cold-start for ~50s; not for a link you send
    region: frankfurt      # EU data residency: the plan is a Spanish company
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: STRIDE_ENV
        value: production
      # Refuses to boot on the dev secret in production -- see config.py
      - key: STRIDE_SECRET
        generateValue: true
      - key: STRIDE_DATABASE_URL
        fromDatabase:
          name: stride-db
          property: connectionString
      # Closed. This is the line that makes the deployment safe to share.
      - key: STRIDE_ALLOW_SIGNUP
        value: "0"
      - key: STRIDE_CHAOS
        value: "0"
      # Same origin in the browser: the web service proxies /api, so the only
      # origin the API ever sees is the web service's own.
      - key: STRIDE_CORS_ORIGINS
        fromService:
          type: web
          name: stride-web
          property: host
      - key: STRIDE_PUBLIC_URL
        fromService:
          type: web
          name: stride-web
          property: host
      # Render terminates TLS at its edge and forwards; without this the rate
      # limiter and the request log would key on the proxy, not the caller.
      - key: STRIDE_FORWARDED_ALLOW_IPS
        value: "*"
      - key: STRIDE_MEDIA_DIR
        value: /data/media
    disk:
      name: stride-media
      mountPath: /data
      sizeGB: 1

  # ── web ────────────────────────────────────────────────────────────────
  - type: web
    name: stride-web
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.web
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # nginx listens on whatever Render assigns; the template reads it.
      - key: STRIDE_WEB_PORT
        value: "80"
      # Set once from the dashboard to the API's internal address, which Render
      # allocates on first deploy. Kept out of the file rather than guessed:
      # a wrong value here is a login page that cannot reach its own API, and
      # that is a worse failure than one documented manual step.
      - key: STRIDE_API_UPSTREAM
        sync: false
