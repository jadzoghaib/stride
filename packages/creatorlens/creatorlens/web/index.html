<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreatorLens — creator marketability console</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-name">CreatorLens</span>
    <span class="brand-sub">creator marketability console</span>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="roster" role="tab">Roster</button>
    <button class="tab" data-view="audit" role="tab">Audit log</button>
  </nav>
  <div class="meta" id="meta-line">—</div>
</header>

<main id="view-roster" class="view split">
  <aside class="roster-pane">
    <div class="pane-head">
      <h2>Creators</h2>
      <span class="pane-note" id="roster-count"></span>
    </div>
    <table class="table roster-table" id="roster-table">
      <thead>
        <tr>
          <th>Creator</th>
          <th>Topic</th>
          <th>Platforms</th>
          <th class="num">Followers</th>
          <th>Dimensions</th>
          <th>Coverage</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </aside>

  <section class="detail-pane" id="detail-pane">
    <div class="empty-note">Select a creator.</div>
  </section>
</main>

<main id="view-audit" class="view" hidden>
  <div class="pane-head">
    <h2>Audit log</h2>
    <label class="filter-label">Event type
      <select id="audit-filter">
        <option value="">all</option>
      </select>
    </label>
    <span class="pane-note" id="audit-count"></span>
  </div>
  <table class="table audit-table" id="audit-table">
    <thead>
      <tr><th>Time (UTC)</th><th>Actor</th><th>Event</th><th>Object</th><th>Detail</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<div id="tooltip" class="tooltip" hidden></div>

<script src="app.js"></script>
</body>
</html>
