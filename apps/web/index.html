<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stride — Athlete Monetization Platform</title>
    <meta name="description" content="Stride connects athletes, clubs, sponsors, and fans through evidence-based marketability analytics." />
    <meta name="theme-color" content="#101216" />
    <meta property="og:title" content="Stride — Athlete Monetization Platform" />
    <meta property="og:description" content="Sponsorship marketplace built on evidence-based marketability analytics." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23101216'/%3E%3Crect x='6' y='7' width='20' height='3' fill='%23FFB020'/%3E%3Ctext x='6' y='25' font-family='Arial Narrow,Arial,sans-serif' font-size='16' font-weight='700' fill='%23F2F4F7'%3ES%3C/text%3E%3C/svg%3E" />

    <!-- The board face carries the whole register; preload so the first paint
         is not a system-font flash on the headline numerals. -->
    <link rel="preload" href="/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Theme resolved before first paint, otherwise a light-mode user gets a
         dark flash (and vice versa). Dark is the default; a stored choice wins. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('stride-theme')
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
