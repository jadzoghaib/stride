[project]
name = "stride-api"
version = "0.1.0"
description = "Stride — athlete monetization & sponsorship platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt>=2.9",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",   # multipart/form-data, for media upload
    "creatorlens",
]

[project.scripts]
stride = "stride_api.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv.sources]
creatorlens = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stride_api"]
