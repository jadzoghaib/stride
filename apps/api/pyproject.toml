[project]
name = "stride-api"
version = "0.1.0"
description = "Stride — athlete monetization & sponsorship platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt>=2.9",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",   # multipart/form-data, for media upload
    # Runtime, not dev: `proofcheck.py` imports it at module scope to fetch an
    # applicant's proof URL, and `admission -> seed -> cli` pulls that in on the
    # way to serving. Declared under `dev` it was present in every environment
    # that ran the tests and absent from the one built with `uv sync --no-dev`,
    # so the container died on import with ModuleNotFoundError -- a failure only
    # a real deploy could surface.
    "httpx>=0.27",
    "creatorlens",
]

[project.scripts]
stride = "stride_api.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv.sources]
creatorlens = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stride_api"]
